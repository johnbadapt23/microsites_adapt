name: Deploy to Staging (SFTP)

# Auto-deploys the built theme to staging every time dev is pushed.
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    # NOTE: STAGING_HOST/PORT/REMOTE_PATH (variables) and STAGING_USERNAME/PASS
    # (secrets) are scoped to a GitHub Environment in this repo's settings.
    # Update the name below if that environment isn't literally called "staging".
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build theme
        run: npx gulp _build

      - name: Remove dev-only files before deploy
        run: rm -rf node_modules .git

      - name: Deploy over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.STAGING_USERNAME }}
          server: ${{ vars.STAGING_HOST }}
          port: ${{ vars.STAGING_PORT }}
          password: ${{ secrets.STAGING_PASS }}
          local_path: './*'
          remote_path: ${{ vars.STAGING_REMOTE_PATH }}
